version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_pass
      POSTGRES_DB: fastapi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    entrypoint: [ "sh", "-c" ]
    command: >
      "
      sleep 10 &&
      kafka-topics.sh --create --if-not-exists --topic file-upload --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 &&
      kafka-topics.sh --create --if-not-exists --topic video-transcription --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1
      "
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend

  transcription_api:
    build:
      context: ./transcription_translate
    container_name: transcription_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fastapi_user:fastapi_pass@postgres:5432/fastapi_db
    depends_on:
      - postgres
      - kafka
    networks:
      - backend
    command: bash -c "source env/bin/activate && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  consumer:
    build:
      context: ./consumer
    container_name: kafka_consumer
    depends_on:
      - kafka
      - transcription_api
    networks:
      - backend
    command: bash -c "source env/bin/activate && python3 consumer.py"

  video_transcription_app:
    build:
      context: ./video-transcription-app
    container_name: video_transcription_app
    ports:
      - "3000:3000"
    networks:
      - backend
    command: npm start

volumes:
  postgres_data:

networks:
  backend:
