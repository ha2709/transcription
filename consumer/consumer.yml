apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: yourdockerhub/consumer:latest
        command: ["python3", "consumer.py"]
        env:
        - name: KAFKA_BROKER
          value: kafka.default.svc.cluster.local:9092
